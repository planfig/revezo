# Copy to revezo.config.yaml (ignored by git) and adjust.
# Credentials always come from environment variables: ${NAME}.
# Providers can also be added on the dashboard (/dashboard). Those are kept, encrypted,
# in the storage.sqlite database below; the ones listed here show as "from the file":
# the dashboard can pause and reorder them, but not remove them.

server:
  port: 8787
  host: 127.0.0.1          # 0.0.0.0 to accept other machines (always with REVEZO_API_KEY)

storage:
  sqlite: ./data/storage.sqlite   # counters + providers added on the dashboard.
                                  # Without it everything stays in memory and the dashboard is read only.

timezone: UTC                # when daily/monthly counters reset

defaults:
  email: email-marketing     # route used by POST /v1/email/send when none is given
  llm: ai                    # route used by POST /v1/chat/completions when none is given

routes:
  email-marketing:
    kind: email
    strategy: priority       # priority | weighted | least-used
    providers:
      - use: brevo
        options: { apiKey: "${BREVO_API_KEY}" }
        limits: { perDay: 300 }
      - use: mailjet
        options: { apiKey: "${MAILJET_API_KEY}", apiSecret: "${MAILJET_API_SECRET}" }
        limits: { perDay: 200, perMonth: 6000 }
      - use: smtp
        name: smtp-backup
        capabilities: { allowsMarketing: false }
        options:
          host: "${SMTP_HOST}"
          port: "${SMTP_PORT}"
          user: "${SMTP_USER}"
          pass: "${SMTP_PASS}"
        limits: { perDay: 100 }

  ai:
    kind: llm
    strategy: least-used     # spread calls over the providers with the most quota left
    providers:
      - use: groq
        options: { apiKey: "${GROQ_API_KEY}", model: llama-3.1-8b-instant }
        limits: { perMinute: 30, perDay: 1000 }
      - use: openrouter
        options: { apiKey: "${OPENROUTER_API_KEY}", model: "meta-llama/llama-3.3-70b-instruct:free" }
        limits: { perMinute: 20, perDay: 50 }
      - use: ollama          # models on your own machine: no key, no quota
        options: { baseUrl: "http://127.0.0.1:11434", model: llama3.2 }
